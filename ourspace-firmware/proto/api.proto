syntax = "proto3";

package ourspace_firmware.v1;

// buf:lint:ignore IMPORT_NO_WEAK
import weak "gnostic/openapi/v3/annotations.proto"; // Will not import _ "" in the gen-go files
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "ourspace-backend/proto/api.proto";

option go_package = "github.com/cfhn/our-space/ourspace-firmware/proto;pb";

option (gnostic.openapi.v3.document) = {
  info: {
    title: "ourspace-firmware-api"
    version: "1.0"
    description: "Local API for the Terminal frontend firmware"
  }
  servers: {
    url: "http://localhost:8080"
    description: "Host Server"
  }
};

service FirmwareService {
  rpc ListenForCardEvents(ListenForCardEventsRequest) returns (stream ListenForCardEventsResponse) {}
}

message ListenForCardEventsRequest {
}

message ListenForCardEventsResponse {
  oneof event {
    PlaceCardEvent place_card = 1;
    RemoveCardEvent remove_card = 2;
  }
}

message PlaceCardEvent {
  string token = 1 [json_name="token"];
  Card card = 2 [json_name="card"];
  Member member = 3 [json_name="member"];
  ourspace_backend.proto.Presence presence = 4 [json_name="presence"];
}

message RemoveCardEvent {}

message Member {
  string id = 1;
  string name = 2;
}

message Card {
  string id = 1;
  google.protobuf.Timestamp valid_from = 2 [json_name="valid_from"];
  google.protobuf.Timestamp valid_to = 3 [json_name="valid_to"];
}

message LocalPresence {
  ourspace_backend.proto.Presence presence = 1;
  google.protobuf.Timestamp synchronized_at = 2;
  google.protobuf.Timestamp modified_at = 3;
}